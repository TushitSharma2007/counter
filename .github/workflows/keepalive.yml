name: Keep dev database awake

# Free Supabase projects pause after 7 days without activity. This pings the dev project's
# health() RPC every 3 days. Production is used daily and doesn't need it.
# Repo secrets: SUPABASE_DEV_URL, SUPABASE_DEV_PUBLISHABLE_KEY

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.SUPABASE_DEV_URL }}
      KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
    steps:
      - name: Ping health()
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::notice::Dev Supabase secrets not set; skipping."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$URL/rest/v1/rpc/health" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
